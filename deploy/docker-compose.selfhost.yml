# PVTKRRX self-host stack
#
# Three separate containers — no systemd required:
#   pvtkrrx      — the Stremio addon / configure UI (port 7000)
#   qbittorrent  — torrent client WebUI (port 8080)
#   prowlarr     — indexer manager / Torznab proxy (port 9696)
#
# Quick start:
#   cp deploy/.env.example deploy/.env   # then edit deploy/.env
#   docker compose -f deploy/docker-compose.selfhost.yml up -d
#
# See deploy/README.md for full setup instructions.

services:

  # ── PVTKRRX ─────────────────────────────────────────────────────────────────
  pvtkrrx:
    build:
      # Build context is the repository root so COPY . . works correctly.
      context: ..
      dockerfile: deploy/Dockerfile.selfhost
    container_name: pvtkrrx
    restart: unless-stopped
    ports:
      - "${PVTKRRX_HOST_PORT:-7000}:7000"
    environment:
      # Self-host mode is baked into the image; these vars allow runtime overrides.
      PVTKRRX_SELF_HOST_MODE: "true"
      PVTKRRX_HOSTED_RELAY: "false"
      PVTKRRX_SELF_HOST_HTTPS_MODE: "${PVTKRRX_SELF_HOST_HTTPS_MODE:-skip}"

      # Public and playback URLs — required for remote Stremio installs.
      PVTKRRX_PUBLIC_BASE_URL: "${PVTKRRX_PUBLIC_BASE_URL:-}"
      PVTKRRX_PLAYBACK_BASE_URL: "${PVTKRRX_PLAYBACK_BASE_URL:-}"

      # Admin token for the configure UI.
      PVTKRRX_SERVER_ADMIN_TOKEN: "${PVTKRRX_SERVER_ADMIN_TOKEN:-}"

      # Point PVTKRRX at the other containers using Docker service DNS names.
      # Users can copy these into the configure UI's Prowlarr/qBittorrent fields.
      PVTKRRX_DEFAULT_PROWLARR_URL: "${PVTKRRX_DEFAULT_PROWLARR_URL:-http://prowlarr:9696}"
      PVTKRRX_DEFAULT_QBIT_URL: "${PVTKRRX_DEFAULT_QBIT_URL:-http://qbittorrent:8080}"

      # Expand libuv thread pool for concurrent sharp poster rendering.
      UV_THREADPOOL_SIZE: "16"
    volumes:
      # Persist PVTKRRX runtime state (config, tokens, poster raster cache, logs).
      - pvtkrrx_data:/data/pvtkrrx
      # Share the downloads directory so PVTKRRX can serve completed files.
      - downloads:/downloads
    depends_on:
      - qbittorrent
      - prowlarr
    # No privileged flag needed — this is a plain Node.js process.

  # ── qBittorrent ──────────────────────────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      # Default WebUI port inside the container.
      WEBUI_PORT: "8080"
    ports:
      - "${QBITTORRENT_HOST_PORT:-8080}:8080"
      # BitTorrent listening port (TCP + UDP) — open this on your router/firewall
      # to improve peer connectivity on private trackers.
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      # Completed downloads are written here and shared with PVTKRRX.
      - downloads:/downloads

  # ── Prowlarr ─────────────────────────────────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    ports:
      - "${PROWLARR_HOST_PORT:-9696}:9696"
    volumes:
      - prowlarr_config:/config

volumes:
  pvtkrrx_data:
  qbittorrent_config:
  prowlarr_config:
  # The downloads volume is shared between qBittorrent and PVTKRRX.
  # If you prefer a host bind-mount, replace the volume definition with:
  #   downloads:
  #     driver: local
  #     driver_opts:
  #       type: none
  #       o: bind
  #       device: "${DOWNLOADS_PATH:-./downloads}"
  # and create the directory first with `mkdir -p downloads`.
  downloads:
